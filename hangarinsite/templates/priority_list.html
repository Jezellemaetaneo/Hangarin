{% extends 'base.html' %}

{% block page_title %}🚩 Priorities{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <h4 class="fw-bold mb-0">Priorities</h4>
            <div class="d-flex gap-2">
                <form method="get" class="d-flex">
                    <input type="search" name="q" class="form-control" placeholder="Search priorities..." value="{{ request.GET.q }}">
                    <button type="submit" class="btn btn-outline-secondary ms-2">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
                <a href="/priority_list/add/" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i> Add
                </a>
            </div>
        </div>

        {% if object_list %}
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th width="180" class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for prio in object_list %}
                    <tr>
                        <td class="fw-medium">{{ prio.name }}</td>
                        <td class="text-end">
                            <a href="/priority_list/edit/{{ prio.pk }}/" class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <a href="/priority_list/delete/{{ prio.pk }}/" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <div class="text-center py-5">
            <i class="bi bi-flag display-1 text-opacity-25"></i>
            <p class="text-muted mt-3">No priorities found.</p>
            <a href="/priority_list/add/" class="btn btn-primary mt-2">
                <i class="bi bi-plus-circle me-1"></i> Add First Priority
            </a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
